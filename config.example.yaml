# Example config. Prefer: status-overlook init
# macOS path: ~/Library/Application Support/status-overlook/config.yaml

schema_version: 1

github:
  login: ""
  actionable_labels:
    - lgtm

jira:
  site: ""              # e.g. redhat.atlassian.net
  account_id: ""        # Atlassian accountId (init probes when possible)
  qa_contact_field: ""  # e.g. customfield_10470
  pr_link_field: ""     # e.g. customfield_10875
  status_blocked:
    - Blocked
  blocked_labels:
    - blocked
  status_testing:
    - Testing
  status_active:
    - New
    - To Do
    - In Progress
  status_review:
    - Review
    - In Review
    - Code Review
  status_done:
    - Resolved
    - Closed
    - Done

pins:
  jira: []
  github: []

done_retention_days: 7
search_limit: 50

scheduler:
  every_minutes: 15

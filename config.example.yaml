# Minimal example. Prefer `status-overlook init` (later): it will probe `gh` / `acli`
# and fill identity fields so you rarely edit this by hand.

schema_version: 1

# Usually detected from `gh api user` / acli auth — leave empty until init exists
github:
  login: ""
  actionable_labels:
    - lgtm

jira:
  site: ""
  qa_contact_field: ""
  pr_link_field: ""
  # Blocked if any match (providers set flagged from Jira Flagged/impediment)
  status_blocked:
    - Blocked
  blocked_labels:
    - blocked

# Optional manual pins
pins:
  jira: []
  github: []

scheduler:
  every_minutes: 15
